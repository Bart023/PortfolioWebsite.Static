<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 4rem;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
        }

        .redirect-info {
            color: #999;
            font-size: 0.9rem;
            margin: 20px 0;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s;
        }
            a:hover {
                background: #0052a3;
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page not found</p>
        <p class="redirect-info">You will be redirected in 3 seconds...</p>
        <a id="homeLink" href="/" aria-label="Go to homepage">Go to homepage</a>
    </div>

    <script>
        (function () {
            var p = location.pathname;

            // Determine language
            var m = p.match(/^\/(nl|en)(\/|$)/);
            var lang = m ? m[1] : null;

            var target = lang ? ("/" + lang + "/") : "/";

            // Update button link
            var link = document.getElementById("homeLink");
            if (link) {
                link.setAttribute("href", target);
            }

            // Redirect to home
            setTimeout(function () {
                location.replace(target);
            }, 3000);
        })();
    </script>
</body>
</html>
